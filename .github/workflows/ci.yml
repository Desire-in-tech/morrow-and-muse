name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Catalogue seed freshness
        working-directory: ${{ github.workspace }}
        run: node --experimental-strip-types scripts/export-catalog.ts --check

      - name: Build
        run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # Postgres 17 matches the major Supabase currently defaults to on the
    # platform and for new self-hosted installs. Credentials exist only for
    # this ephemeral service container.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: morrow
          POSTGRES_PASSWORD: morrow
          POSTGRES_DB: morrow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morrow -d morrow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://morrow:morrow@localhost:5432/morrow_test?sslmode=disable
      TEST_DATABASE_URL: postgres://morrow:morrow@localhost:5432/morrow_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Migrate up, down to zero, up
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate down-to 0
          go run ./cmd/migrate up

      - name: Test
        run: go test ./...

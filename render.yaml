# Blueprint for the Go API. Syncing this file in the Render dashboard creates
# a service. This repository change does not sync it and does not deploy.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: morrow-and-muse-api
    runtime: go
    plan: free
    branch: main
    rootDir: backend
    buildCommand: go build -o bin/api ./cmd/api
    startCommand: ./bin/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
